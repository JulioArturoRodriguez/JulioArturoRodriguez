name: Detect Frameworks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main         
          fetch-depth: 0    

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib requests

      - name: Run framework detection script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/frameworks.py

      - name: Insert frameworks.md into README
        run: |
          sed -i '/<!-- AUTO-FRAMEWORKS -->/r output/frameworks.md' README.md

      - name: Commit and push results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          git add output/frameworks.png output/frameworks.md README.md
          git commit -m "Update framework stats" || echo "No changes to commit"

          git pull --rebase origin main   # 👈 AHORA SÍ FUNCIONA
          git push origin main
