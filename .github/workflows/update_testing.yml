# Workflow update
name: Update Testing Stats

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install matplotlib requests

      - name: Run testing analysis
        run: python scripts/testing.py

      - name: Update README with testing stats
        run: |
          sed -i '/<!-- AUTO-TESTING -->/r output/testing.md' README.md

      - name: Commit and push results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git pull --rebase origin main || true
          git add output/testing.png output/testing.json output/testing.md README.md
          git commit -m "Update testing stats" || echo "No changes to commit"
          git push
