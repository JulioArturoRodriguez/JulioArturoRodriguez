# Workflow updated
name: Update Database Stats

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"   # Cada 24 horas a medianoche UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install matplotlib requests

      - name: Run database analysis
        run: python scripts/databases.py

      - name: Update README with database stats
        run: |
          sed -i '/<!-- AUTO-DATABASES -->/r output/databases.md' README.md

      - name: Commit and push results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add output/databases.png output/databases.json output/databases.md README.md
          git commit -m "Update database stats" || echo "No changes to commit"
          git push
