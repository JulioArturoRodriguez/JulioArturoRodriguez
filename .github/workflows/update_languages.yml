# actualización forzada para refrescar el workflow
name: Update Language Stats

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install matplotlib requests

      - name: Run language analysis
        run: python scripts/languages.py

      - name: Update README with language stats
        run: |
          sed -i '/<!-- AUTO-LANGUAGES -->/r output/languages.md' README.md

      - name: Configure git credentials
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git remote remove origin
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Commit and push results
        run: |
          git add output/languages.png output/languages.json output/languages.md README.md
          git commit -m "Update language stats" || echo "No changes to commit"
          git push || true
