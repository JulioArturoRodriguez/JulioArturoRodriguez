# Workflow updated
name: Update Language Stats

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"   # Cada 24 horas a medianoche UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install matplotlib requests

      - name: Run language analysis
        run: python scripts/languages.py

      - name: Update README with language stats
        run: |
          sed -i '/<!-- AUTO-LANGUAGES -->/r output/languages.md' README.md

      - name: Commit and push results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add output/languages.png output/languages.json output/languages.md README.md
          git commit -m "Update language stats" || echo "No changes to commit"
          git push
