# Workflow update
name: Update Machine Learning Stats

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"   # Cada 24 horas a medianoche UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install matplotlib requests

      - name: Run machine learning analysis
        run: python scripts/machine_learning.py

      - name: Update README with ML stats
        run: |
          sed -i '/<!-- AUTO-ML -->/r output/machine_learning.md' README.md

      - name: Commit and push results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add output/machine_learning.png output/machine_learning.json output/machine_learning.md README.md
          git commit -m "Update machine learning stats" || echo "No changes to commit"
          git push
