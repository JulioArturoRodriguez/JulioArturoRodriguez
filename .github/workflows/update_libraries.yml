name: Update Library Stats

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: main              # 👈 RAMA CORRECTA
          fetch-depth: 0         # 👈 NECESARIO PARA PULL
          persist-credentials: false
          clean: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install matplotlib requests

      - name: Run library analysis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/libraries.py

      - name: Update README with library stats
        run: |
          sed -i '/<!-- AUTO-LIBRARIES -->/r output/libraries.md' README.md

      - name: Configure git credentials
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git remote remove origin
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Commit and push results
        run: |
          # Seguridad: solo agregar si existen
          if [ -f output/libraries.png ]; then
            git add output/libraries.png
          fi

          if [ -f output/libraries.md ]; then
            git add output/libraries.md
          fi

          git add README.md

          git commit -m "Update library stats" || echo "No changes to commit"

          git pull --rebase origin main || true
          git push origin main || true
